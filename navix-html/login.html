<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVIX - Đăng nhập / Đăng ký</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo">
      <div style="width: 32px; height: 32px; border-radius: 8px; background-color: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;">N</div>
      NAVIX
    </a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Trang chủ</a>
      <a href="#" onclick="alert('Tính năng Giới thiệu NAVIX'); return false;" class="nav-link">Giới thiệu</a>
      <a href="#" onclick="alert('Tính năng Doanh nghiệp'); return false;" class="nav-link">Doanh nghiệp Partner</a>
    </nav>
    <div class="auth-buttons">
      <a href="index.html" class="btn-outline">Quay lại Trang chủ</a>
    </div>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px;">
    <div class="animate-fade-in" style="max-width: 440px; width: 100%;">
      <div style="background-color: #fff; padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md);">
        <h2 style="font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px;">Đăng nhập NAVIX</h2>
        <p style="text-align: center; font-size: 14px; color: var(--text-muted); margin-bottom: 24px;">Chọn loại tài khoản để truy cập Dashboard</p>

        <!-- Role Toggle -->
        <div style="display: flex; gap: 8px; margin-bottom: 20px; background-color: var(--bg-main); padding: 4px; border-radius: var(--radius-md);">
          <button type="button" id="btn-role-student" class="role-btn" style="flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; background-color: #fff; color: var(--primary); box-shadow: var(--shadow-sm);">Tôi là cá nhân</button>
          <button type="button" id="btn-role-business" class="role-btn" style="flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; background-color: transparent; color: var(--text-muted);">Tôi là doanh nghiệp</button>
        </div>

        <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">Email</label>
            <input type="email" id="input-email" required placeholder="name@example.com" value="enzy@navix.vn" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);" />
          </div>

          <div>
            <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px;">Mật khẩu</label>
            <input type="password" required value="12345678" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);" />
          </div>

          <button type="submit" class="btn-primary" style="margin-top: 8px; padding: 12px; width: 100%; font-size: 15px;">
            Đăng nhập
          </button>

          <div style="text-align: center; margin-top: 12px; font-size: 13px; color: var(--text-muted);">
            Chưa có tài khoản? <a href="#" onclick="alert('Form Đăng ký đang được nạp...'); return false;" style="color: var(--primary); font-weight: 700;">Đăng ký ngay</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
