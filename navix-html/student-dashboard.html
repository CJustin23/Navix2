<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAVIX - Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo">
      <div style="width: 32px; height: 32px; border-radius: 8px; background-color: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;">N</div>
      NAVIX
    </a>
    <div class="auth-buttons">
      <a href="student-dashboard.html" class="btn-outline" style="border-color: var(--primary); color: var(--primary);">👤 Trang cá nhân</a>
      <span style="font-size: 14px; font-weight: 700; color: var(--primary);" id="user-display-name">Enzy</span>
      <a href="index.html" class="btn-outline" style="color: #ef4444;" onclick="localStorage.removeItem('userRole');">Đăng xuất</a>
    </div>
  </header>

  <!-- DASHBOARD CONTAINER -->
  <div style="display: flex; flex: 1; height: calc(100vh - 73px);">
    <!-- SIDEBAR -->
    <aside id="student-sidebar" style="width: 260px; background-color: #fff; border-right: 1px solid var(--border-color); padding: 20px 12px; display: flex; flex-direction: column; justify-content: space-between; transition: width 0.2s ease;">
      <div>
        <button id="btn-toggle-sidebar" style="padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 14px; font-weight: 600;">
          <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
          <span class="sidebar-text">Thu gọn</span>
        </button>

        <nav style="display: flex; flex-direction: column; gap: 4px;">
          <button class="student-nav-btn active" data-tab="overview" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 700; background-color: var(--primary-light); color: var(--primary); border-left: 4px solid var(--primary); width: 100%; text-align: left;">
            <i data-lucide="layout-dashboard" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Tổng quan</span>
          </button>
          <button class="student-nav-btn" data-tab="explore" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="compass" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Khám phá nghề nghiệp</span>
          </button>
          <button class="student-nav-btn" data-tab="ai-roadmap" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="git-merge" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Lộ trình AI cá nhân hoá</span>
          </button>
          <button class="student-nav-btn" data-tab="simulation" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="briefcase" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Mô phỏng việc làm</span>
          </button>
          <button class="student-nav-btn" data-tab="cv" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="file-text" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Xây dựng CV</span>
          </button>
          <button class="student-nav-btn" data-tab="interview" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="message-square" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Luyện tập phỏng vấn</span>
          </button>
          <button class="student-nav-btn" data-tab="referral" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; color: var(--text-muted); border-left: 4px solid transparent; width: 100%; text-align: left;">
            <i data-lucide="share-2" style="width: 18px; height: 18px;"></i>
            <span class="sidebar-text">Giới thiệu bạn bè</span>
          </button>
        </nav>
      </div>

      <a href="index.html" onclick="localStorage.removeItem('userRole');" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); color: #ef4444; font-size: 14px; font-weight: 600;">
        <i data-lucide="log-out" style="width: 18px; height: 18px;"></i>
        <span class="sidebar-text">Đăng xuất</span>
      </a>
    </aside>

    <!-- TAB CONTENT AREA -->
    <div style="flex: 1; padding: 32px; overflow-y: auto; background-color: var(--bg-main);" id="student-tab-content">
      <!-- Nội dung tab sẽ được render đầy đủ 100% -->
    </div>
  </div>

  <div id="modal-root"></div>

  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="components.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
  <script>
    // Bridge kết nối HTML Multi-page với Engine Pages của SPA để giữ 100% tính năng React!
    document.addEventListener('DOMContentLoaded', () => {
      window.setState({ currentPage: 'student-dashboard', studentTab: 'overview' });
      
      const studentNavBtns = document.querySelectorAll('.student-nav-btn');
      studentNavBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          studentNavBtns.forEach(b => {
            b.classList.remove('active');
            b.style.backgroundColor = 'transparent';
            b.style.color = 'var(--text-muted)';
            b.style.borderLeft = '4px solid transparent';
            b.style.fontWeight = '500';
          });
          btn.classList.add('active');
          btn.style.backgroundColor = 'var(--primary-light)';
          btn.style.color = 'var(--primary)';
          btn.style.borderLeft = '4px solid var(--primary)';
          btn.style.fontWeight = '700';

          const tab = btn.getAttribute('data-tab');
          window.setState({ studentTab: tab });
        });
      });

      // Override renderApp để render trực tiếp vào tab content của HTML tĩnh
      const oldRender = window.renderApp;
      window.renderApp = function() {
        const studentTabContent = document.getElementById('student-tab-content');
        if (studentTabContent && window.appState.currentPage === 'student-dashboard') {
          // Render đúng nội dung tab phong phú 100%
          const dashboardHtml = window.StudentDashboard();
          // Extract tab content từ template
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = dashboardHtml;
          const contentDiv = tempDiv.querySelector('div[style*="flex: 1; padding: 32px"]');
          if (contentDiv) {
            studentTabContent.innerHTML = contentDiv.innerHTML;
          }
        }
        window.renderModals();
        if (window.lucide) window.lucide.createIcons();
      };

      window.renderApp();
    });
  </script>
</body>
</html>
